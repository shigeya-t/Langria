name: Langria
options:
  bundleIdPrefix: io.github.shigeya-t
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
# Team などの手元の設定は Local.xcconfig（git 管理外）に書く。Signing.xcconfig がそれを読む。
# The one exception to "no external libraries": the ads. UMP comes with it,
# but is named too because the app imports it directly.
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.1.0
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      # Google's test banner, so development builds never show live ads.
      ADMOB_BANNER_UNIT_ID: ca-app-pub-3940256099942544/2435281174
    Release:
      ADMOB_BANNER_UNIT_ID: ca-app-pub-1566635098782317/9032522022
targets:
  Langria:
    type: application
    platform: iOS
    sources:
      - path: Langria
      # The UI text, the target languages and the commit hash are shared with
      # the web app and the extension; the app runs them in JavaScriptCore.
      - path: ../extension/lib/i18n.js
        buildPhase: resources
      - path: ../extension/lib/languages.js
        buildPhase: resources
      # Written by .githooks/write-version; absent right after a clone.
      - path: ../extension/lib/version.js
        buildPhase: resources
        optional: true
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    settings:
      PRODUCT_NAME: Langria
      GENERATE_INFOPLIST_FILE: true
      INFOPLIST_FILE: Langria/Info.plist
      INFOPLIST_KEY_CFBundleDisplayName: Langria
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      INFOPLIST_KEY_NSCameraUsageDescription: Langria uses the camera to photograph text and translate it. The text is read on this device.
      INFOPLIST_KEY_NSFaceIDUsageDescription: Langria uses Face ID to unlock your API keys.
      INFOPLIST_KEY_NSMicrophoneUsageDescription: Langria uses the microphone for voice input of the text to translate.
      INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Langria turns your speech into text to translate. It runs on this device when the language supports it.
      INFOPLIST_KEY_NSUserTrackingUsageDescription: Langria shows ads to keep the app free. Allowing tracking lets the ads match your interests; the text you translate is never used.
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTS_MACCATALYST: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  LangriaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LangriaTests
    dependencies:
      - target: Langria
    settings:
      GENERATE_INFOPLIST_FILE: true
      PRODUCT_BUNDLE_IDENTIFIER: $(inherited).tests
schemes:
  Langria:
    build:
      targets:
        Langria: all
    test:
      targets:
        - LangriaTests
    run:
      config: Debug
    archive:
      config: Release
